# Primary configuration. This is the run you report as your headline result.
name: rank16_frozen

lora:
  r: 16
  alpha: 32          # alpha/r = 2.0. Keep this ratio constant across rank ablations,
                     # or you are varying two things at once and the ablation says nothing.
  dropout: 0.05
  freeze_vision: true
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  seed: 42
  epochs: 2
  per_device_batch_size: 1
  gradient_accumulation_steps: 8     # effective batch = 8
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  optim: paged_adamw_8bit
  gradient_checkpointing: true
  bf16: false        # T4 is Turing: NO bf16. Set true only on L4/A100/H100.
  fp16: true
  max_grad_norm: 0.3
  logging_steps: 10
  save_steps: 100    # Colab disconnects. Checkpoint often.

data:
  max_pixels: 602112   # ~768x784. Image tokens dominate sequence length; this is
                       # your primary OOM lever. Lower it before lowering batch size.
  max_seq_length: 1024

output_dir: outputs/rank16_frozen
